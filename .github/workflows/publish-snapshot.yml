name: Publish Snapshot to GitHub Packages

on:
  push:
    branches:
      - main
      - 'tylerstapler/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Flyway Fork
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: 'maven'
        server-id: github

    - name: Install Maven 3.8.8
      run: |
        wget https://archive.apache.org/dist/maven/maven-3/3.8.8/binaries/apache-maven-3.8.8-bin.tar.gz
        tar xzf apache-maven-3.8.8-bin.tar.gz
        echo "$PWD/apache-maven-3.8.8/bin" >> $GITHUB_PATH

    - name: Verify Maven version
      run: mvn --version

    - name: Extract version from pom.xml
      id: version
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Build packages
      run: mvn -B clean package -DskipTests

    - name: Deploy to GitHub Packages
      run: |
        mvn -B org.apache.maven.plugins:maven-deploy-plugin:2.8.2:deploy \
          -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository }} \
          -DskipTests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create deployment summary
      run: |
        echo "## 📦 Published Flyway Fork Snapshot to GitHub Packages" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Version**: \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Published Modules:" >> $GITHUB_STEP_SUMMARY
        echo "- org.flywaydb:flyway-core:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- org.flywaydb:flyway-database-postgresql:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- org.flywaydb:flyway-gradle-plugin:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- org.flywaydb:flyway-maven-plugin:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### To use this snapshot:" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`xml" >> $GITHUB_STEP_SUMMARY
        echo "<repositories>" >> $GITHUB_STEP_SUMMARY
        echo "  <repository>" >> $GITHUB_STEP_SUMMARY
        echo "    <id>github</id>" >> $GITHUB_STEP_SUMMARY
        echo "    <url>https://maven.pkg.github.com/${{ github.repository }}</url>" >> $GITHUB_STEP_SUMMARY
        echo "  </repository>" >> $GITHUB_STEP_SUMMARY
        echo "</repositories>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "<dependency>" >> $GITHUB_STEP_SUMMARY
        echo "  <groupId>org.flywaydb</groupId>" >> $GITHUB_STEP_SUMMARY
        echo "  <artifactId>flyway-core</artifactId>" >> $GITHUB_STEP_SUMMARY
        echo "  <version>${{ steps.version.outputs.version }}</version>" >> $GITHUB_STEP_SUMMARY
        echo "</dependency>" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
