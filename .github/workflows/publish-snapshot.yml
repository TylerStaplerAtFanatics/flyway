name: Publish Snapshot to GitHub Packages

on:
  push:
    branches:
      - main
      - 'tylerstapler/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Flyway Fork
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: 'maven'

    - name: Configure Maven settings for GitHub Packages
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << 'EOF'
        <settings>
          <servers>
            <server>
              <id>github</id>
              <username>${env.GITHUB_ACTOR}</username>
              <password>${env.GITHUB_TOKEN}</password>
            </server>
          </servers>
        </settings>
        EOF

    - name: Extract version from pom.xml
      id: version
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Debug - Check effective POM for central-publishing plugin
      run: |
        echo "=== Checking for central-publishing-maven-plugin in effective POM ==="
        mvn help:effective-pom -pl flyway-core | grep -A 15 "central-publishing" || echo "Plugin not found in effective POM"
        echo ""
        echo "=== Checking Maven version ==="
        mvn --version
        echo ""
        echo "=== Checking for plugin in build extensions ==="
        find . -name "pom.xml" -exec grep -H "central-publishing" {} \; || echo "No references found in any POM files"

    - name: Build artifacts
      run: mvn -B install -DskipTests -pl flyway-core,flyway-database/flyway-database-postgresql,flyway-plugins/flyway-gradle-plugin,flyway-plugins/flyway-maven-plugin -am

    - name: Deploy to GitHub Packages with JReleaser
      run: mvn -B org.jreleaser:jreleaser-maven-plugin:1.15.0:deploy -pl flyway-core,flyway-database/flyway-database-postgresql,flyway-plugins/flyway-gradle-plugin,flyway-plugins/flyway-maven-plugin
      env:
        JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        JRELEASER_GPG_PASSPHRASE: ''
        JRELEASER_GPG_PUBLIC_KEY: ''
        JRELEASER_GPG_SECRET_KEY: ''

    - name: Create deployment summary
      run: |
        echo "## 📦 Published Flyway Fork Snapshot to GitHub Packages" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Version**: \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Published Modules:" >> $GITHUB_STEP_SUMMARY
        echo "- org.flywaydb:flyway-core:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- org.flywaydb:flyway-database-postgresql:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- org.flywaydb:flyway-gradle-plugin:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- org.flywaydb:flyway-maven-plugin:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### To use this snapshot:" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`xml" >> $GITHUB_STEP_SUMMARY
        echo "<repositories>" >> $GITHUB_STEP_SUMMARY
        echo "  <repository>" >> $GITHUB_STEP_SUMMARY
        echo "    <id>github</id>" >> $GITHUB_STEP_SUMMARY
        echo "    <url>https://maven.pkg.github.com/${{ github.repository }}</url>" >> $GITHUB_STEP_SUMMARY
        echo "  </repository>" >> $GITHUB_STEP_SUMMARY
        echo "</repositories>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "<dependency>" >> $GITHUB_STEP_SUMMARY
        echo "  <groupId>org.flywaydb</groupId>" >> $GITHUB_STEP_SUMMARY
        echo "  <artifactId>flyway-core</artifactId>" >> $GITHUB_STEP_SUMMARY
        echo "  <version>${{ steps.version.outputs.version }}</version>" >> $GITHUB_STEP_SUMMARY
        echo "</dependency>" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
