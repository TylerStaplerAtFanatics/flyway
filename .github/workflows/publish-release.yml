name: Publish Release to GitHub Packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 11.20.0)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Flyway Fork
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        cache: 'maven'
        server-id: github # Value of the distributionManagement/repository/id field in pom.xml
        server-username: GITHUB_ACTOR
        server-password: GITHUB_TOKEN

    - name: Build with Maven
      run: mvn -B clean install -DskipTests -Dmaven.install.skip=false -pl flyway-core,flyway-database/flyway-database-postgresql,flyway-plugins/flyway-gradle-plugin,flyway-plugins/flyway-maven-plugin -am

    - name: Publish to GitHub Packages
      run: mvn -B deploy -DskipTests -pl flyway-core,flyway-database/flyway-database-postgresql,flyway-plugins/flyway-gradle-plugin,flyway-plugins/flyway-maven-plugin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}

    - name: Create deployment summary
      run: |
        echo "## 🚀 Published Flyway Fork to GitHub Packages" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Published Modules:" >> $GITHUB_STEP_SUMMARY
        echo "- org.flywaydb:flyway-core:${{ github.event.release.tag_name || inputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- org.flywaydb:flyway-database-postgresql:${{ github.event.release.tag_name || inputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- org.flywaydb:flyway-gradle-plugin:${{ github.event.release.tag_name || inputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- org.flywaydb:flyway-maven-plugin:${{ github.event.release.tag_name || inputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### To use this version:" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`xml" >> $GITHUB_STEP_SUMMARY
        echo "<repositories>" >> $GITHUB_STEP_SUMMARY
        echo "  <repository>" >> $GITHUB_STEP_SUMMARY
        echo "    <id>github</id>" >> $GITHUB_STEP_SUMMARY
        echo "    <url>https://maven.pkg.github.com/${{ github.repository }}</url>" >> $GITHUB_STEP_SUMMARY
        echo "  </repository>" >> $GITHUB_STEP_SUMMARY
        echo "</repositories>" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "<dependency>" >> $GITHUB_STEP_SUMMARY
        echo "  <groupId>org.flywaydb</groupId>" >> $GITHUB_STEP_SUMMARY
        echo "  <artifactId>flyway-core</artifactId>" >> $GITHUB_STEP_SUMMARY
        echo "  <version>${{ github.event.release.tag_name || inputs.version }}</version>" >> $GITHUB_STEP_SUMMARY
        echo "</dependency>" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
